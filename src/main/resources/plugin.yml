name: Townia
version: '${version}'
main: fr.townia.TowniaPlugin
api-version: '1.21'
author: Townia
depend: [Multiverse-Core]
softdepend: [DiscordSRV, SkinsRestorer]
description: Villages, claims, permissions and administration for Paper.
commands:
  village:
    aliases: [v, town]
    description: Manage your village.
    usage: /village
  claim:
    description: Claim the current chunk for your village.
    usage: /claim
  unclaim:
    description: Unclaim the current chunk from your village.
    usage: /unclaim
  sethome:
    description: Set the village home.
    usage: /sethome [village]
  home:
    description: Teleport to the village home.
    usage: /home
    permission: townia.village.home
  delhome:
    description: Delete the village home.
    usage: /delhome [village]
  world:
    description: Manage Townia worlds.
    usage: /world
    permission: townia.admin.world
  event:
    description: Teleport to the active event world.
    usage: /event
    permission: townia.event
  leave:
    description: Return to the main world from a custom /world dimension.
    usage: /leave
    permission: townia.world.leave
  townia:
    aliases: [towniaadmin]
    description: Townia administration.
    usage: /townia <help|reload|stats>
    permission: townia.admin
  aide:
    description: Affiche le guide d'utilisation de Townia.
    usage: /aide [admin]
  regles:
    description: Ouvre le règlement du serveur dans un livre.
    usage: /regles
permissions:
  townia.admin:
    default: op
  townia.admin.world:
    default: op
  townia.event:
    default: true
  townia.world.leave:
    default: true
  townia.bypass:
    default: op
  townia.village.create:
    default: true
  townia.village.home:
    default: true
  townia.village.claim:
    default: true
  townia.village.manage:
    default: true
